<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Results summary component</title>


  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <!-- <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style> -->

</head>
<body>
  
  <main>
    <div class="score-panel">
      <section class="score-result">

        <h2>Your Result</h2>
        
        
        <div class="score-number">
          <p><b>76</b></p>
          <p>of 100</p>
        </div>
          
        <p><b>Great</b></p>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
        
      </section>

      <section class="score-summary">
        <h2>Summary</h2>

        <div class="summary-score">

          <div class="reaction-score">
            <img src="./assets/images/icon-reaction.svg" alt="">
            <p>Reaction</p>
            <p><b>80</b> / 100</p>
          </div>

          <div class="memory-score">
            <img src="./assets/images/icon-memory.svg" alt="">
            <p>Memory</p>
            <p><b>92</b> / 100</p>
          </div>

          <div class="verbal-score">
            <img src="./assets/images/icon-verbal.svg" alt="">
            <p>Verbal</p>
            <p><b>61</b> / 100</p>
          </div>

          <div class="visual-score">
            <img src="./assets/images/icon-visual.svg" alt="">
            <p>Visual</p>
            <p><b>73</b> / 100</p>
          </div>
          
        </div>

        <button>Continue</button>

      </section>
    </div>
  </main>
  
  <footer>
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Flogdhooft">Flogdhooft</a>.
  </footer>

</body>
</html>
